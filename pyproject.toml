[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zxcode-agent"
version = "3.5.6"
description = "Local-first autonomous software engineering agent"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"

# Keep runtime dependencies aligned with requirements.txt during migration.
dependencies = [
  "rich>=13.7.0",
  "httpx>=0.27.0",
  "aiohttp>=3.9.0",
  "gitpython>=3.1.42",
  "tree-sitter>=0.21.0",
  "tree-sitter-python>=0.21.0",
  "tree-sitter-javascript>=0.21.0",
  "tree-sitter-typescript>=0.21.0",
  "tiktoken>=0.6.0",
  "prompt-toolkit>=3.0.40",
]

[project.optional-dependencies]
mcp = [
  "mcp>=1.30,<2",
  "jsonschema>=4.21,<5",
  "keyring>=25,<27",
]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.23.0",
  "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
zxcode = "main:cli"

[tool.setuptools]
py-modules = ["main"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = [
  "config*", "core*", "execution*", "indexing*", "memory*",
  "planner*", "plugins*", "providers*", "skills*", "storage*", "tools*", "zxcode_mcp*",
  "ui*", "utils*",
]
exclude = ["tests*", "docs*", "specs*"]

[tool.setuptools.package-data]
skills = ["**/*.md", "**/*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
addopts = "-ra"
