name: Publish GitHub Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing or new version tag to build and publish (for example v3.5.6)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run test suite
        run: python -m pytest -q
      - name: Compile Python files
        run: python -m compileall -q .

  publish:
    name: Build and publish release
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release source and tag history
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Build release assets
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          TAG_COMMIT="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          mkdir -p dist

          # Select the newest earlier version tag reachable from this release.
          mapfile -t REACHABLE_TAGS < <(git for-each-ref --merged="${TAG_COMMIT}" --sort=-version:refname --format='%(refname:short)' refs/tags)
          PREVIOUS_TAG=""
          for candidate in "${REACHABLE_TAGS[@]}"; do
            if [[ "${candidate}" != "${RELEASE_TAG}" ]]; then
              PREVIOUS_TAG="${candidate}"
              break
            fi
          done

          # A first release has no earlier tag; diff from the canonical empty tree.
          if [[ -n "${PREVIOUS_TAG}" ]]; then
            DIFF_BASE="$(git rev-parse "${PREVIOUS_TAG}^{commit}")"
          else
            DIFF_BASE="$(git hash-object -t tree /dev/null)"
          fi

          git archive --format=zip --prefix="zxcode-agent-v${VERSION}/" "${TAG_COMMIT}" > "dist/ZX-Code-Agent-v${VERSION}.zip"
          git diff --binary "${DIFF_BASE}" "${TAG_COMMIT}" > "dist/ZX-Code-Agent-v${VERSION}.patch"
          (cd dist && sha256sum "ZX-Code-Agent-v${VERSION}.zip" "ZX-Code-Agent-v${VERSION}.patch" > "ZX-Code-Agent-v${VERSION}-SHA256SUMS.txt")
          (cd dist && sha256sum -c "ZX-Code-Agent-v${VERSION}-SHA256SUMS.txt")
      - name: Publish or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist/* \
              --title "ZX Code ${RELEASE_TAG}" \
              --generate-notes
          fi
